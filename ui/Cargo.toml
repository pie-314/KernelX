[package]
name = "kernelx-hud"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernelx-hud"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
memmap2 = "0.9"
bytemuck = { version = "1.15", features = ["derive"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = "0.33"
